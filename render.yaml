services:
  - type: web
    name: ai-photo-studio
    runtime: python
    repo: https://github.com/yourusername/ai-photo-studio  # replace
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: CUDA_VISIBLE_DEVICES
        value: ""  # set if GPU available